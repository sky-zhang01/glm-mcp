[project]
name = "glm-mcp"
version = "0.1.0"
description = "MCP server for ZhipuAI GLM — chat and text embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14",
    "openai>=1.0",
]

[project.scripts]
glm-mcp = "glm_mcp:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
